server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts at most 5 MiB by default. Keep a little proxy
    # headroom so valid uploads are not rejected by Nginx's 1 MiB default.
    client_max_body_size 8m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Share proxy — forward OG requests to the backend
    location /share/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000/api/v1/share/;
    }

    # Keep browser traffic on one origin. Relative API URLs work from a
    # server hostname, LAN IP, or HTTPS reverse proxy without rebuilding the
    # frontend for each school deployment.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8000;
    }

    # Local self-hosted uploads are served by FastAPI from the persistent
    # uploads volume.
    location /uploads/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # MCP Streamable HTTP needs buffering disabled for long-lived streams.
    location /mcp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_pass http://backend:8000;
    }

    # Database-aware readiness endpoint used by operators and reverse proxies.
    location = /healthz {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/v1/health;
    }

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
