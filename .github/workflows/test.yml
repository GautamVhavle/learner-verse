name: Test & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Cache Python deps
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Lint with Ruff
        run: cd backend && uv run ruff check app/ --output-format=github
        continue-on-error: true

      - name: Format check
        run: cd backend && uv run ruff format app/ --check
        continue-on-error: true

      - name: Run tests
        env:
          SINGLE_USER_MODE: 'true'
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key-12345678901234567890123456789012
          OPENROUTER_API_KEY: test-key
          ENVIRONMENT: test
        run: |
          # Safety check: ensure we're NOT using production DB
          if [[ "$DATABASE_URL" == *"supabase"* ]]; then
            echo "❌ ERROR: Production database detected in tests! Aborting."
            exit 1
          fi
          cd backend && uv run pytest tests/ -v --tb=short
        continue-on-error: true

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests & Build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: cd frontend && npm run lint
        continue-on-error: true

      - name: Format check
        run: cd frontend && npx prettier --check src/
        continue-on-error: true

      - name: Build
        run: cd frontend && npm run build
        continue-on-error: true

      - name: Run unit tests
        run: cd frontend && npm run test -- --run
        continue-on-error: true
