name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Before Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Backend lint
        run: cd backend && uv sync && uv run ruff check app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Frontend checks
        run: |
          cd frontend && npm ci
          npx tsc --noEmit
          npm run build

  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy Frontend (Vercel)
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Checkout the private submodule for production build
      - name: Checkout private submodule
        uses: actions/checkout@v4
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # Copy real payment files for production build
      - name: Prepare payment files
        run: |
          cp private/frontend/src/hooks/useSubscription.ts frontend/src/hooks/useSubscription.ts
          cp private/frontend/src/components/subscription/ProGateDialog.tsx frontend/src/components/subscription/ProGateDialog.tsx
          cp private/frontend/src/components/subscription/CongratulationsDialog.tsx frontend/src/components/subscription/CongratulationsDialog.tsx
          cp private/frontend/src/components/home/PricingSection.tsx frontend/src/components/home/PricingSection.tsx
          cp private/frontend/src/pages/PricingPage.tsx frontend/src/pages/PricingPage.tsx
          cp private/frontend/src/pages/RenewPage.tsx frontend/src/pages/RenewPage.tsx
          cp private/frontend/src/types/subscription.ts frontend/src/types/subscription.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@53.1.1

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy Backend (FastAPI Cloud)
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Checkout private submodule for production backend
      - name: Checkout private submodule
        uses: actions/checkout@v4
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # Copy real payment files for production build
      - name: Prepare payment files
        run: |
          cp private/backend/app/services/subscription_service.py backend/app/services/subscription_service.py
          cp private/backend/app/api/v1/endpoints/subscription.py backend/app/api/v1/endpoints/subscription.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
        run: |
          cd backend
          mkdir -p .fastapicloud
          echo '{"app_id":"${{ secrets.FASTAPI_CLOUD_APP_ID }}","team_id":"${{ secrets.FASTAPI_CLOUD_TEAM_ID }}"}' > .fastapicloud/cloud.json
          uv sync
          uv run fastapi cloud deploy
