name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test-before-deploy:
    runs-on: ubuntu-latest
    name: Validate Before Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install backend deps
        run: cd backend && uv sync

      - name: Backend lint check
        run: cd backend && uv run ruff check app/
        continue-on-error: true

      - name: Backend tests
        env:
          SINGLE_USER_MODE: 'true'
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key-12345678901234567890123456789012
          OPENROUTER_API_KEY: test-key
          ENVIRONMENT: test
        run: |
          # Safety check: ensure we're NOT using production DB
          if [[ "$DATABASE_URL" == *"supabase"* ]]; then
            echo "❌ ERROR: Production database detected in tests! Aborting."
            exit 1
          fi
          cd backend && uv run pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend type check
        run: cd frontend && npx tsc --noEmit
        continue-on-error: true

      - name: Frontend build
        run: cd frontend && npm run build
        continue-on-error: true

  deploy-frontend-vercel:
    needs: test-before-deploy
    runs-on: ubuntu-latest
    name: Deploy Frontend to Vercel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd frontend
          npm install -g vercel
          vercel --prod --token=$VERCEL_TOKEN

      - name: Comment PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Frontend deployed to Vercel\n🌐 Live at https://learnerverse.xyz'
            })

  deploy-backend-fastapi-cloud:
    needs: test-before-deploy
    runs-on: ubuntu-latest
    name: Deploy Backend to FastAPI Cloud
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          cd backend
          uv sync
          uv run fastapi deploy --app-id $FASTAPI_CLOUD_APP_ID

      - name: Comment PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Backend deployed to FastAPI Cloud\n🔗 API at https://learner-verse.fastapicloud.dev'
            })

  notify-deployment:
    needs: [deploy-frontend-vercel, deploy-backend-fastapi-cloud]
    runs-on: ubuntu-latest
    name: Notify Deployment Complete
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "✅ Deployment pipeline completed!"
          echo "🌐 Frontend: https://learnerverse.xyz"
          echo "🔗 Backend: https://learner-verse.fastapicloud.dev"
