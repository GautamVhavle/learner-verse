name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Before Deploy
    steps:
      - uses: actions/checkout@v7

      # Checkout private submodule for validation
      - name: Checkout private submodule
        uses: actions/checkout@v7
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Prepare private files
        run: |
          rm -f backend/app/services/subscription_service.py
          cp private/backend/app/services/subscription_service.py backend/app/services/subscription_service.py
          rm -f backend/app/api/v1/endpoints/subscription.py
          cp private/backend/app/api/v1/endpoints/subscription.py backend/app/api/v1/endpoints/subscription.py
          rm -f frontend/src/hooks/useSubscription.ts
          cp private/frontend/src/hooks/useSubscription.ts frontend/src/hooks/useSubscription.ts
          rm -f frontend/src/components/subscription/ProGateDialog.tsx
          cp private/frontend/src/components/subscription/ProGateDialog.tsx frontend/src/components/subscription/ProGateDialog.tsx
          rm -f frontend/src/components/subscription/CongratulationsDialog.tsx
          cp private/frontend/src/components/subscription/CongratulationsDialog.tsx frontend/src/components/subscription/CongratulationsDialog.tsx
          rm -f frontend/src/components/home/PricingSection.tsx
          cp private/frontend/src/components/home/PricingSection.tsx frontend/src/components/home/PricingSection.tsx
          rm -f frontend/src/pages/PricingPage.tsx
          cp private/frontend/src/pages/PricingPage.tsx frontend/src/pages/PricingPage.tsx
          rm -f frontend/src/pages/RenewPage.tsx
          cp private/frontend/src/pages/RenewPage.tsx frontend/src/pages/RenewPage.tsx
          rm -f frontend/src/types/subscription.ts
          cp private/frontend/src/types/subscription.ts frontend/src/types/subscription.ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Backend checks
        env:
          SINGLE_USER_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
          SECRET_KEY: "test-secret-key-12345678901234567890123456789012"
          SENTRY_ENVIRONMENT: "test"
        run: |
          cd backend
          uv sync
          uv run ruff check app/ --exclude app/api/v1/endpoints/subscription.py --exclude app/services/subscription_service.py
          uv run ruff format app/ --check --exclude app/api/v1/endpoints/subscription.py --exclude app/services/subscription_service.py
          uv run alembic heads
          uv run pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Frontend checks
        run: |
          cd frontend && npm ci
          npx prettier --write src/hooks/useSubscription.ts src/components/subscription/ProGateDialog.tsx src/components/subscription/CongratulationsDialog.tsx src/components/home/PricingSection.tsx src/pages/PricingPage.tsx src/pages/RenewPage.tsx src/types/subscription.ts
          npx tsc --noEmit
          npm run lint
          npx prettier --check "src/**/*.{ts,tsx,css}"
          npm run test -- --run
          npm run build

  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy Frontend (Vercel)
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Checkout the private submodule for production build
      - name: Checkout private submodule
        uses: actions/checkout@v7
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # Replace symlinks with real files for production build
      - name: Prepare payment files
        run: |
          rm -f frontend/src/hooks/useSubscription.ts
          cp private/frontend/src/hooks/useSubscription.ts frontend/src/hooks/useSubscription.ts
          rm -f frontend/src/components/subscription/ProGateDialog.tsx
          cp private/frontend/src/components/subscription/ProGateDialog.tsx frontend/src/components/subscription/ProGateDialog.tsx
          rm -f frontend/src/components/subscription/CongratulationsDialog.tsx
          cp private/frontend/src/components/subscription/CongratulationsDialog.tsx frontend/src/components/subscription/CongratulationsDialog.tsx
          rm -f frontend/src/components/home/PricingSection.tsx
          cp private/frontend/src/components/home/PricingSection.tsx frontend/src/components/home/PricingSection.tsx
          rm -f frontend/src/pages/PricingPage.tsx
          cp private/frontend/src/pages/PricingPage.tsx frontend/src/pages/PricingPage.tsx
          rm -f frontend/src/pages/RenewPage.tsx
          cp private/frontend/src/pages/RenewPage.tsx frontend/src/pages/RenewPage.tsx
          rm -f frontend/src/types/subscription.ts
          cp private/frontend/src/types/subscription.ts frontend/src/types/subscription.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@53.1.1

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
          VITE_PAYMENT_GATEWAY_ENABLED: "true"
          VITE_API_BASE_URL: "https://learner-verse.fastapicloud.dev/api/v1"
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy Backend (FastAPI Cloud)
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Checkout private submodule for production backend
      - name: Checkout private submodule
        uses: actions/checkout@v7
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # Replace symlinks with real files for production backend
      - name: Prepare payment files
        run: |
          rm -f backend/app/services/subscription_service.py
          cp private/backend/app/services/subscription_service.py backend/app/services/subscription_service.py
          rm -f backend/app/api/v1/endpoints/subscription.py
          cp private/backend/app/api/v1/endpoints/subscription.py backend/app/api/v1/endpoints/subscription.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
        run: |
          cd backend
          mkdir -p .fastapicloud
          echo '{"app_id":"${{ secrets.FASTAPI_CLOUD_APP_ID }}","team_id":"${{ secrets.FASTAPI_CLOUD_TEAM_ID }}"}' > .fastapicloud/cloud.json
          uv sync
          # Runtime configuration is managed persistently in FastAPI Cloud.
          # The CI deploy token intentionally has deployment-only permissions.
          uv run fastapi cloud deploy
