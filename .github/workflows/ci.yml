name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    name: Backend Lint & Test
    steps:
      - uses: actions/checkout@v4

      # Checkout private submodule for payment files
      - name: Checkout private submodule
        uses: actions/checkout@v4
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # Replace symlinks with real files from private repo
      - name: Prepare private files
        run: |
          rm -f backend/app/services/subscription_service.py
          cp private/backend/app/services/subscription_service.py backend/app/services/subscription_service.py
          rm -f backend/app/api/v1/endpoints/subscription.py
          cp private/backend/app/api/v1/endpoints/subscription.py backend/app/api/v1/endpoints/subscription.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Lint
        run: cd backend && uv run ruff check app/ --output-format=github --exclude app/api/v1/endpoints/subscription.py --exclude app/services/subscription_service.py

      - name: Format check
        run: cd backend && uv run ruff format app/ --check --exclude app/api/v1/endpoints/subscription.py --exclude app/services/subscription_service.py

      - name: Run tests
        env:
          SINGLE_USER_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
          SECRET_KEY: "test-secret-key-12345678901234567890123456789012"
          OPENROUTER_API_KEY: "test-key"
          ENVIRONMENT: "test"
        run: |
          if [[ "$DATABASE_URL" == *"supabase"* ]] || [[ "$DATABASE_URL" == *"neon"* ]]; then
            echo "ERROR: Production database detected in tests! Aborting."
            exit 1
          fi
          cd backend && uv run pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    name: Frontend Lint, Type-check & Test
    steps:
      - uses: actions/checkout@v4

      # Checkout private submodule for payment files
      - name: Checkout private submodule
        uses: actions/checkout@v4
        with:
          repository: GautamVhavle/learner-verse-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # Replace symlinks with real files from private repo
      - name: Prepare private files
        run: |
          rm -f frontend/src/hooks/useSubscription.ts
          cp private/frontend/src/hooks/useSubscription.ts frontend/src/hooks/useSubscription.ts
          rm -f frontend/src/components/subscription/ProGateDialog.tsx
          cp private/frontend/src/components/subscription/ProGateDialog.tsx frontend/src/components/subscription/ProGateDialog.tsx
          rm -f frontend/src/components/subscription/CongratulationsDialog.tsx
          cp private/frontend/src/components/subscription/CongratulationsDialog.tsx frontend/src/components/subscription/CongratulationsDialog.tsx
          rm -f frontend/src/components/home/PricingSection.tsx
          cp private/frontend/src/components/home/PricingSection.tsx frontend/src/components/home/PricingSection.tsx
          rm -f frontend/src/pages/PricingPage.tsx
          cp private/frontend/src/pages/PricingPage.tsx frontend/src/pages/PricingPage.tsx
          rm -f frontend/src/pages/RenewPage.tsx
          cp private/frontend/src/pages/RenewPage.tsx frontend/src/pages/RenewPage.tsx
          rm -f frontend/src/types/subscription.ts
          cp private/frontend/src/types/subscription.ts frontend/src/types/subscription.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Format private files
        run: cd frontend && npx prettier --write src/hooks/useSubscription.ts src/components/subscription/ProGateDialog.tsx src/components/subscription/CongratulationsDialog.tsx src/components/home/PricingSection.tsx src/pages/PricingPage.tsx src/pages/RenewPage.tsx src/types/subscription.ts

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Lint
        run: cd frontend && npm run lint
        continue-on-error: true  # TODO: fix existing React compiler warnings

      - name: Format check
        run: cd frontend && npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Build
        run: cd frontend && npm run build

      - name: Unit tests
        run: cd frontend && npm run test -- --run
