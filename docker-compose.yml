services:
  # ── PostgreSQL ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: learnerverse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnerverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnerverse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/learnerverse
      SINGLE_USER_MODE: "true"
      SECRET_KEY: "docker-dev-secret-key"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      UPLOAD_DIR: "/app/uploads"
      MAX_UPLOAD_SIZE_MB: "5"
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      SUPABASE_BUCKET: "thumbnails"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend (React + Nginx) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_SINGLE_USER_MODE: "true"
        VITE_AUTH0_DOMAIN: ""
        VITE_AUTH0_CLIENT_ID: ""
        VITE_AUTH0_AUDIENCE: ""
    container_name: learnerverse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
